<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <!-- <link rel="stylesheet" type="text/css" href="D:\Sai_MiTRAz\Blossom_flower_shop_assignment\Blossom_flower_shop_assignment\CSS\Bloosom-style.css"> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* body {
            margin: 0 10px;
        } */

        /* ---------------------------------HEADER------------------------------- */
        .header img {
            width: 300px;
            height: 150px;
        }

        .header {
            margin: 10px 10px 10px 20px;
            display: flex;
        }

        .nav {
            width: 100%;
            /* margin-right: 15px; */
            margin: 60px 0 60px 10px;
            background-color: #0d2056;
            border-radius: 5px;
            padding: 10px 10px 10px 1px;
        }

        .nav a {
            /* width: 100%; */
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 10px 15px;
        }

        .nav a:hover {
            background-color: white;
            color: black;
        }

        .nav a.active {
            background-color: red;
        }

        .end {
            margin-left: 60%;
        }

        a img{
            width: 300px;
            height: 250px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            background-color: #0d2056;

        }

        .foot1 {
            color: white;
            align-content: center;
            margin-left: 20px;
        }

        .foot_img {
            display: flex;
        }

        .foot_img img {
            margin: 0 10px;
            padding: 5px;
            width: 50px;
            height: 50px;
        }
        @media screen and (max-width: 568px){
            .header img{
                height: 200px;
                width: 450px;
            }
            .header{
                flex-direction: column;
                margin: 10px;
            }
            .nav{
                display: flex;
            }
            .end{
                margin: 0;
            }

            .nav{
                margin-bottom: 10px;
            }
            a img{
                margin: 0 0 10px 100px;
                align-content: center;
            }
            footer{
                position: static;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <header>
            <img src="./images/logo.png">
        </header>
        <nav class="nav">
            <a href="Bloosom_home.html">Home</a>
            <a href="Bloosom_products.html">Products</a>
            <a href="#" class="active">Videos</a>
            <a href="Bloosom_Contactform.html">Contact Us</a>
            <a href="#" class="end">Logout</a>
        </nav>
    </div>
    <div>
        <nav>
            <a href="Bloosom_video.html"><img src="./images/pv1.JPG"></a>
        </nav>
    </div>
    <footer>
        <div class="footer">
            <div class="foot1">
                <p>&copy;Bloosom Flowershop</p>
            </div>
            <div class="foot_img">
                <div><img src="./icon/fb.png"></div>
                <div><img src="./icon/twitter.png"></div>
                <div><img src="./icon/ig.png"></div>
            </div>
        </div>
    </footer>
</body>

</html>
