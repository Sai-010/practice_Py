<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <!-- <link rel="stylesheet" type="text/css" href="D:\Sai_MiTRAz\Blossom_flower_shop_assignment\Blossom_flower_shop_assignment\CSS\Bloosom-style.css"> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ---------------------------------HEADER------------------------------- */
        .header img {
            width: 300px;
            height: 150px;
        }

        .header {
            margin: 10px 10px 10px 20px;
            display: flex;
        }

        .nav {
            width: 100%;
            /* margin-right: 15px; */
            margin: 60px 0 60px 10px;
            background-color: #0d2056;
            border-radius: 5px;
            padding: 10px 10px 10px 1px;
        }

        .nav a {
            /* width: 100%; */
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 10px 15px;
        }

        .nav a:hover {
            background-color: white;
            color: black;
        }

        .nav a.active {
            background-color: red;
        }

        .end {
            margin-left: 60%;
        }

        .div {
            display: flex;
            justify-content: space-evenly;
            margin: 20px 0;
            box-shadow: 2px 2px 10px lightgray;
        }

        .div1 {
            text-align: center;
        }

        .div2 {
            box-shadow: 2px 2px 10px black;
            border: 2px solid lightgrey;
            background-color: rgba(211, 211, 211, 0.505);
            width: 600px;
            height: 500px;
            margin: 20px;
        }

        .div3 {
            margin: 20px;
            box-shadow: 2px 2px 10px black;
        }

        label,
        input,
        textarea {
            width: 100%;
            padding: 10px 0;
            margin: 10px 0;
            padding: 10px;
        }

        button {
            font-weight: bold;
            width: 90px;
            padding: 10px;
            transition: 250ms ease;
            background-color: #0d2056;
            color: white;
            border-radius: 5px;
            border: none;
        }

        button:hover {
            transform: scale(1.02);
            background-color: green;
        }

        .h2 h2 {
            display: block;
            text-align: center;
            font-family: cursive;
        }

        form {
            padding: 20px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            background-color: #0d2056;

        }

        .foot1 {
            color: white;
            align-content: center;
            margin-left: 20px;
        }

        .foot_img {
            display: flex;
        }

        .foot_img img {
            margin: 0 10px;
            padding: 5px;
            width: 50px;
            height: 50px;
        }

        @media screen and (max-width: 568px){
            .header img{
                height: 200px;
                width: 450px;
            }
            .header{
                flex-direction: column;
                margin: 10px;
            }
            .nav{
                display: flex;
            }
            .end{
                margin: 0;
            }
           .div{
            flex-direction: column;
           }
           .div2{
            width: 450px;
            height: 550px;
           }
           iframe{
            width: 450px;
            /* height: ; */
           }
        }
    </style>
</head>

<body>
    <div class="header">
        <header>
            <img src="./images/logo.png">
        </header>
        <nav class="nav">
            <a href="Bloosom_home.html">Home</a>
            <a href="Bloosom_products.html">Products</a>
            <a href="Bloosom_videoimg.html">Videos</a>
            <a href="#" class="active">Contact Us</a>
            <a href="#" class="end">Logout</a>
        </nav>
    </div>
    <div class="h2">
        <h2>Contact us Form</h2>
        <div class="div">
            <div class="div2">
                <form>
                    <label for="fname">First Name:</label><br>
                    <input type="text" id="fname" name="fname" placeholder="Your First Name..."><br>
                    <label for="lname">Last Name:</label><br>
                    <input type="text" id="lname" name="lname" placeholder="Your Last Name..."><br>
                    <label for="mail">Mail:</label><br>
                    <input type="email" id="mail" name="mail" placeholder="Your Mail..."><br>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject" placeholder="Your Subject..."><br>
                    <label for="msg">Message:</label><br>
                    <textarea id="msg" rows="5" cols="20" name="message" placeholder="Enter your message..."></textarea><br>
                    <button type="submit">Submit</button><br>
                </form>
            </div>
            <div class="div3">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30916.271459965687!2d78.06062784790743!3d14.396356358211817!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb3e7b7b8fd5dd5%3A0xafe20373711f2d86!2sThimmanayanipalem%2C%20Andhra%20Pradesh!5e0!3m2!1sen!2sin!4v1760339384112!5m2!1sen!2sin"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer">
            <div class="foot1">
                <p>&copy;Bloosom Flowershop</p>
            </div>
            <div class="foot_img">
                <div><img src="./icon/fb.png"></div>
                <div><img src="./icon/twitter.png"></div>
                <div><img src="./icon/ig.png"></div>
            </div>
        </div>
    </footer>
</body>

</html>
