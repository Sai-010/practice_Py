<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <!-- <link rel="stylesheet" type="text/css" href="D:\Sai_MiTRAz\Blossom_flower_shop_assignment\Blossom_flower_shop_assignment\CSS\Bloosom-style.css"> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* body {
            margin: 0 10px;
        } */

        /* ---------------------------------HEADER------------------------------- */
        .header img {
            width: 300px;
            height: 150px;
        }

        .header {
            margin: 10px 10px 10px 20px;
            display: flex;
        }

        .nav {
            width: 100%;
            /* margin-right: 15px; */
            margin: 60px 0 60px 10px;
            background-color: #0d2056;
            border-radius: 5px;
            padding: 10px 10px 10px 1px;
        }

        .nav a {
            /* width: 100%; */
            text-decoration: none;
            color: rgb(177, 148, 148);
            font-weight: bold;
            padding: 10px 15px;
        }

        .nav a:hover {
            background-color: rgb(196, 144, 144);
            color: black;
        }

        .nav a.active {
            background-color: red;
        }

        .end {
            margin-left: 60%;
        }

        marquee{
            text-align: center;
            margin: 0 auto;
        }
        .marquee{
            width: 55%;
            margin: 0 auto;
        }
        .vid_img {
            display: flex;
            justify-content: center;
            
        }

        .vid_img div img {
            width: 200px;
            height: 100px;
            margin: 10px 30px;
            border-radius: 5px;
        }

        .vid video {
            width: 600px;
            height: 400px;
        }

        .images {
            display: flex;
            flex-direction: column;
            margin-top: 30px;
            margin-left: 10px;
            border: 2px solid rgba(0, 0, 0, 0.349);
            border-radius: 3px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            background-color: #9da5ba;

        }

        .foot1 {
            color: rgb(233, 81, 81);
            align-content: center;
            margin-left: 20px;
        }

        .foot_img {
            display: flex;
        }

        .foot_img img {
            margin: 0 10px;
            padding: 5px;
            width: 50px;
            height: 50px;
        }

        @media screen and (max-width: 568px){
            .header img{
                height: 200px;
                width: 450px;
            }
            .header{
                flex-direction: column;
                margin: 10px;
            }
            .nav{
                display: flex;
            }
            .end{
                margin: 0;
            }
            .vid_img{
                flex-direction: column;
            }
           .vid_img div .images{
            margin-bottom: 50px;
           }
            
            .vid video{
                width: 300px;
                height: 200px;
                /* padding-top: -150px; */
            }
        }
    </style>
</head>


<body>
    <div class="header">
        <header>
            <img src="./images/logo.png">
        </header>
        <nav class="nav">
            <a href="Bloosom_home.html">Home</a>
            <a href="Bloosom_products.html">Products</a>
            <a href="#" class="active">Videos</a>
            <a href="Bloosom_Contactform.html">Contact Us</a>
            <a href="#" class="end">Logout</a>
        </nav>
    </div>
    <div class="marquee">
        <marquee behavior="scroll"  scrollamount="12"><h1>Let us bring smile for you!</h1></marquee>
        <div class="vid_img">
            <div class="vid">
                <video width="250px" height="250px" controls>
                    <source src="./video/v1.mp4" type="video/mp4" alt="video">
                    Your default browser will not support this video.
                </video>
            </div>
            <div class="images">
                <a href="#"><img src="./images/pv2.JPG"></a>
                <a href="#"><img src="./images/pv3.JPG"></a>
                <a href="#"><img src="./images/pv4.JPG"></a>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer">
            <div class="foot1">
                <p>&copy;sai nathreddy</p>
            </div>
            <div class="foot_img">
                <div><img src="./icon/fb.png"></div>
                <div><img src="./icon/twitter.png"></div>
                <div><img src="./icon/ig.png"></div>
            </div>
        </div>
    </footer>
</body>

</html>
